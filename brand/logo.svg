<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="river-bulk logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1B3A"/>
      <stop offset="1" stop-color="#0A3D62"/>
    </linearGradient>
    <linearGradient id="river" x1="96" y1="150" x2="416" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="key" x1="300" y1="180" x2="420" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#1E3A8A" stroke-opacity="0.6" stroke-width="2"/>

  <!-- flowing river waves -->
  <path d="M56 214c40-30 78-30 118 0s78 30 118 0 78-30 118 0 78 30 118 0"
        stroke="url(#river)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M56 286c40-30 78-30 118 0s78 30 118 0 78-30 118 0 78 30 118 0"
        stroke="url(#river)" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M56 358c40-30 78-30 118 0s78 30 118 0 78-30 118 0 78 30 118 0"
        stroke="url(#river)" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- key badge -->
  <g transform="translate(292 150) rotate(18)">
    <circle cx="46" cy="46" r="40" fill="url(#key)"/>
    <circle cx="46" cy="46" r="15" fill="#0B1B3A"/>
    <rect x="78" y="38" width="66" height="16" rx="8" fill="url(#key)"/>
    <rect x="118" y="54" width="14" height="24" rx="6" fill="url(#key)"/>
    <rect x="96" y="54" width="14" height="20" rx="6" fill="url(#key)"/>
  </g>
</svg>
